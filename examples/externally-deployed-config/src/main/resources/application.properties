# Operator API credential — sourced from env, never a checked-in default.
webhookrelay.auth-credential=${AUTH_CREDENTIAL}

mp.messaging.incoming.domain-events.connector=smallrye-kafka
mp.messaging.incoming.domain-events.topic=domain-events
# Fixed thread-pool size for the blocking consumer — see DomainEventConsumer, no env override.
domain-events-pool.max-concurrency=4

subscription-registry/mp-rest/url=${SUBSCRIPTION_REGISTRY_URL}

webhookrelay.retry-job.interval=${RETRY_JOB_INTERVAL:1m}

# Deliberately absent from this repo: container resource requests/limits, replica count,
# autoscaling policy, and alerting thresholds. Those are defined in the platform-infra repo's
# webhook-relay/ overlay — see docs/architecture.md's "What's managed elsewhere" section.
